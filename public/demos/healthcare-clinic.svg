  <text x="150" y="1250" font-family="sans-serif" font-size="36" font-weight="900" fill="#ffffff" text-anchor="middle">12,000+</text>
  <text x="150" y="1285" font-family="sans-serif" font-size="14" font-weight="bold" fill="#e0f2fe" text-anchor="middle">Happy Patients Served</text>

  <text x="400" y="1250" font-family="sans-serif" font-size="36" font-weight="900" fill="#ffffff" text-anchor="middle">4.9 ★</text>
  <text x="400" y="1285" font-family="sans-serif" font-size="14" font-weight="bold" fill="#e0f2fe" text-anchor="middle">Google Patient Reviews</text>

  <text x="650" y="1250" font-family="sans-serif" font-size="36" font-weight="900" fill="#ffffff" text-anchor="middle">100%</text>
  <text x="650" y="1285" font-family="sans-serif" font-size="14" font-weight="bold" fill="#e0f2fe" text-anchor="middle">Hygiene &amp; Safety Standard</text>

