    <circle cx="440" cy="70" r="40" fill="#334155"/>
    <text x="440" y="75" font-family="sans-serif" font-size="24" text-anchor="middle">👩‍⚕️</text>
    <text x="500" y="60" font-family="sans-serif" font-size="18" font-weight="bold" fill="#ffffff">Dr. Sneha Kapoor</text>
    <text x="500" y="85" font-family="sans-serif" font-size="13" fill="#38bdf8">BDS, MDS (Orthodontics)</text>
    <text x="500" y="110" font-family="sans-serif" font-size="12" fill="#94a3b8">12+ Years Experience</text>
    <rect x="390" y="150" width="290" height="40" rx="8" fill="#0284c7"/>
    <text x="535" y="175" font-family="sans-serif" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">Book WhatsApp Appointment</text>
