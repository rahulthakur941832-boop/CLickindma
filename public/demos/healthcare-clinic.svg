  <text x="50" y="1660" font-family="sans-serif" font-size="20" font-weight="bold" fill="#38bdf8">APEX HEALTHCARE CLINIC</text>
  <text x="50" y="1695" font-family="sans-serif" font-size="13" fill="#94a3b8">Address: Sector 18, Main Market, Delhi NCR</text>
  <text x="50" y="1720" font-family="sans-serif" font-size="13" fill="#94a3b8">Appointments: +91 88822 92448 | Website Built by Clickin DMA</text>
