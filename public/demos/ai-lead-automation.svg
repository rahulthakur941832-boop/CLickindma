<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1800" width="800" height="1800">
  <rect width="800" height="1800" fill="#080a0f"/>

  <!-- Top Bar -->
  <rect width="800" height="36" fill="#111827"/>
  <text x="400" y="23" font-family="sans-serif" font-size="12" font-weight="bold" fill="#10b981" text-anchor="middle">⚡ WHATSAPP &amp; INSTAGRAM AI LEAD AUTOMATION CRM FOR B2B AGENCIES &amp; LOCAL BUSINESSES</text>

  <!-- Navbar -->
  <rect y="36" width="800" height="70" fill="#0d1117" stroke="#1f2937"/>
  <text x="40" y="78" font-family="sans-serif" font-size="24" font-weight="900" fill="#10b981">LEADFLOW <tspan fill="#ffffff">AI</tspan></text>

  <text x="360" y="76" font-family="sans-serif" font-size="13" font-weight="500" fill="#ffffff">AI Chatbots</text>
  <text x="450" y="76" font-family="sans-serif" font-size="13" font-weight="500" fill="#9ca3af">Outreach CRM</text>
  <text x="560" y="76" font-family="sans-serif" font-size="13" font-weight="500" fill="#9ca3af">Integrations</text>

  <rect x="670" y="56" width="90" height="32" rx="6" fill="#10b981"/>
  <text x="715" y="77" font-family="sans-serif" font-size="12" font-weight="bold" fill="#000000" text-anchor="middle">Free Demo</text>

  <!-- Hero Section -->
  <rect y="106" width="800" height="460" fill="#0f172a"/>
  <circle cx="200" cy="300" r="180" fill="#10b981" opacity="0.12"/>

  <text x="50" y="195" font-family="sans-serif" font-size="12" font-weight="bold" fill="#10b981" letter-spacing="2">AUTOMATED SALES ENGINE 2026</text>
  <text x="50" y="245" font-family="sans-serif" font-size="40" font-weight="900" fill="#ffffff">Convert 3X More Leads</text>
  <text x="50" y="295" font-family="sans-serif" font-size="40" font-weight="900" fill="#10b981">On Auto-Pilot With AI</text>
  <text x="50" y="340" font-family="sans-serif" font-size="15" fill="#9ca3af">AI agents reply in 5 seconds on WhatsApp, qualify leads, &amp; book calls in calendar.</text>

  <rect x="50" y="375" width="200" height="48" rx="8" fill="#10b981"/>
  <text x="150" y="405" font-family="sans-serif" font-size="14" font-weight="bold" fill="#000000" text-anchor="middle">TEST AI CHATBOT →</text>

  <!-- Live CRM Dashboard Preview -->
  <rect x="420" y="150" width="340" height="380" rx="16" fill="#111827" stroke="#10b981" stroke-width="2"/>
  <rect x="440" y="170" width="300" height="40" rx="8" fill="#1f2937"/>
  <text x="455" y="195" font-family="sans-serif" font-size="13" font-weight="bold" fill="#10b981">🟢 AI Agent Live: 142 Active Leads</text>

  <g transform="translate(440, 225)">
    <!-- Chat Bubble 1 -->
    <rect width="240" height="45" rx="8" fill="#1f2937"/>
    <text x="15" y="28" font-family="sans-serif" font-size="11" fill="#e5e7eb">Customer: What is your price for 5-page website?</text>

    <!-- Chat Bubble 2 AI -->
    <rect x="50" y="55" width="250" height="55" rx="8" fill="#065f46"/>
    <text x="65" y="78" font-family="sans-serif" font-size="11" fill="#34d399">AI Bot: Our 5-page website package is ₹8,000 including free hosting!</text>

    <!-- Chat Bubble 3 Booking -->
    <rect x="50" y="120" width="250" height="50" rx="8" fill="#10b981"/>
    <text x="65" y="148" font-family="sans-serif" font-size="12" font-weight="bold" fill="#000000">🎉 Appointment Scheduled in Google Calendar!</text>
  </g>

  <!-- Features Grid -->
  <text x="400" y="620" font-family="sans-serif" font-size="28" font-weight="bold" fill="#ffffff" text-anchor="middle">Powerful AI Growth Features</text>

  <g transform="translate(40, 660)">
    <rect width="220" height="220" rx="12" fill="#111827" stroke="#1f2937"/>
    <text x="20" y="45" font-family="sans-serif" font-size="24">💬</text>
    <text x="20" y="85" font-family="sans-serif" font-size="16" font-weight="bold" fill="#ffffff">WhatsApp Auto-Reply</text>
    <text x="20" y="115" font-family="sans-serif" font-size="12" fill="#9ca3af">Never miss a late-night inquiry. Auto answer prices, catalogues &amp; booking links.</text>

    <rect x="250" y="0" width="220" height="220" rx="12" fill="#111827" stroke="#10b981"/>
    <text x="270" y="45" font-family="sans-serif" font-size="24">🤖</text>
    <text x="270" y="85" font-family="sans-serif" font-size="16" font-weight="bold" fill="#34d399">Smart Lead Scoring</text>
    <text x="270" y="115" font-family="sans-serif" font-size="12" fill="#9ca3af">AI filters hot leads with budget &amp; assigns them to your sales team automatically.</text>

    <rect x="500" y="0" width="220" height="220" rx="12" fill="#111827" stroke="#1f2937"/>
    <text x="520" y="45" font-family="sans-serif" font-size="24">📧</text>
    <text x="520" y="85" font-family="sans-serif" font-size="16" font-weight="bold" fill="#ffffff">Automated Follow-ups</text>
    <text x="520" y="115" font-family="sans-serif" font-size="12" fill="#9ca3af">7-day drip sequence on WhatsApp &amp; Email to close unresponsive prospects.</text>
  </g>

  <!-- ROI Stats Banner -->
  <rect y="950" width="800" height="180" fill="#10b981"/>
  <text x="200" y="1020" font-family="sans-serif" font-size="38" font-weight="900" fill="#000000" text-anchor="middle">5 Seconds</text>
  <text x="200" y="1055" font-family="sans-serif" font-size="14" font-weight="bold" fill="#064e3b" text-anchor="middle">Average Lead Response Time</text>

  <text x="600" y="1020" font-family="sans-serif" font-size="38" font-weight="900" fill="#000000" text-anchor="middle">3.4X</text>
  <text x="600" y="1055" font-family="sans-serif" font-size="14" font-weight="bold" fill="#064e3b" text-anchor="middle">Higher Lead Conversion Rate</text>

  <!-- Footer -->
  <rect y="1620" width="800" height="180" fill="#030712"/>
  <text x="50" y="1680" font-family="sans-serif" font-size="20" font-weight="bold" fill="#10b981">LEADFLOW AI</text>
  <text x="50" y="1710" font-family="sans-serif" font-size="12" fill="#6b7280">© 2026 LeadFlow AI Automation. Built by Clickin DMA.</text>
